{% extends "base.html" %}
{% block title %}Cart · Mall{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-black mb-6">Your Cart</h1>

  <div id="cart-container" class="space-y-3 hidden">
    <div id="cart-items"></div>
    
    <div class="bg-white border border-slate-200 rounded-2xl p-5 mt-6">
      <div class="flex justify-between items-center mb-6">
        <span class="text-lg text-slate-600">Total</span>
        <span id="cart-total" class="text-2xl font-black text-amber-600">₦0.00</span>
      </div>
      
      <form id="checkout-form" class="space-y-4">
        <div>
          <label class="text-sm font-medium">Delivery Address</label>
          <input name="address" required minlength="8" maxlength="300" placeholder="Enter your full address" class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-400 outline-none">
        </div>
        <div>
          <label class="text-sm font-medium">Phone Number</label>
          <input name="phone" required maxlength="20" inputmode="tel" placeholder="08012345678" class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-400 outline-none">
        </div>
        <button type="submit" id="pay-btn" class="w-full py-4 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-bold text-lg shadow-lg transition">
          Pay with Paystack
        </button>
      </form>
    </div>
  </div>

  <div id="empty-cart" class="text-center py-20 hidden">
    <p class="text-6xl mb-4">🛒</p>
    <h2 class="text-xl font-bold mb-2">Your cart is empty</h2>
    <a href="/" class="text-amber-600 font-semibold hover:underline">Go shopping →</a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/cart.js') }}" defer></script>
{% endblock %}

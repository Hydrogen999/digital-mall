{% extends "base.html" %}
{% block content %}
<div id="chat-root" data-conv-id="{{ conv.id }}" data-my-id="{{ current_user.id }}" class="max-w-3xl mx-auto px-4 py-6">
  <div class="bg-white rounded-2xl border border-slate-200 h-[70vh] flex flex-col">
    <div class="p-4 border-b flex items-center gap-3">
      {% if shop.logo %}<img src="{{ shop.logo }}" class="w-10 h-10 rounded-full object-cover">{% endif %}
      <div>
        <div class="font-bold">{{ shop.name }}</div>
        <div id="status" class="text-xs text-slate-500">● Online</div>
      </div>
    </div>

    <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

    <form id="send-form" class="p-3 border-t flex gap-2">
      <input id="input" maxlength="1000" autocomplete="off" placeholder="Ask about a product, price, delivery…"
             class="flex-1 px-4 py-2 rounded-full border border-slate-200 focus:ring-2 focus:ring-amber-400 outline-none">
      <button class="px-5 py-2 rounded-full bg-amber-500 text-white font-semibold">Send</button>
    </form>
  </div>
</div>

<script type="application/json" id="chat-history">{{ history|tojson }}</script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
<script src="{{ url_for('static', filename='js/chat.js') }}" defer></script>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto py-12 px-4">
  <h1 class="text-3xl font-black mb-2">Open your shop</h1>
  <p class="text-slate-500 mb-6">You're one step away from owning a storefront in the mall.</p>
  <form method="POST" action="/vendor/shop/create" enctype="multipart/form-data"
        class="bg-white rounded-2xl border border-slate-200 p-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input name="name" required placeholder="Business name (e.g. Royal Collections)"
           class="w-full px-3 py-2 border rounded-lg">
    <input name="category" required placeholder="Category (e.g. Watches, Fashion, Electronics)"
           class="w-full px-3 py-2 border rounded-lg">
    <textarea name="description" rows="3" placeholder="Tell shoppers what you sell"
              class="w-full px-3 py-2 border rounded-lg"></textarea>
    <input name="location" placeholder="Location (e.g. Lagos, Nigeria)"
           class="w-full px-3 py-2 border rounded-lg">
    <div>
      <label class="text-sm text-slate-600">Logo</label>
      <input name="logo" type="file" accept="image/*" class="block text-sm mt-1">
    </div>
    <div>
      <label class="text-sm text-slate-600">Banner</label>
      <input name="banner" type="file" accept="image/*" class="block text-sm mt-1">
    </div>
    <button class="w-full py-3 bg-amber-500 text-white rounded-lg font-semibold">
      Create my shop
    </button>
  </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<section class="max-w-7xl mx-auto px-4 pt-10 pb-6">
  <h1 class="text-4xl md:text-6xl font-black tracking-tight">Walk into any store.<br><span class="text-amber-500">Talk to the owner.</span></h1>
</section>
<section class="max-w-7xl mx-auto px-4 py-8">
  <h2 class="text-2xl font-bold mb-4">Featured Shops</h2>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    {% for s in shops %}
      <a href="/shop/{{ s.slug }}" class="group rounded-2xl overflow-hidden bg-white border border-slate-200 hover:shadow-xl transition">
        <div class="h-32 bg-slate-200"><img src="{{ s.banner or 'https://via.placeholder.com/400x200' }}" class="w-full h-full object-cover"></div>
        <div class="p-3"><div class="font-semibold text-sm">{{ s.name }}</div></div>
      </a>
    {% endfor %}
  </div>
</section>
<section class="max-w-7xl mx-auto px-4 py-8">
  <h2 class="text-2xl font-bold mb-4">Trending Products</h2>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    {% for p in products %}
      <a href="/product/{{ p.id }}" class="bg-white rounded-2xl border border-slate-200 overflow-hidden hover:shadow-lg transition">
        <div class="aspect-square bg-slate-100"><img src="{{ p.image or 'https://via.placeholder.com/400' }}" class="w-full h-full object-cover"></div>
        <div class="p-3">
          <div class="text-sm font-medium truncate">{{ p.name }}</div>
          <div class="font-bold text-amber-600">₦{{ "{:,.2f}".format(p.price) }}</div>
        </div>
      </a>
    {% endfor %}
  </div>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Payment Successful · Mall{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-24 text-center">
  <div class="text-6xl mb-4">🎉</div>
  <h1 class="text-3xl font-black mb-2">Payment Received!</h1>
  <p class="text-slate-500 mb-8">
    Thank you! Your order <b>#{{ order.reference }}</b> has been confirmed. 
    We are waiting for the vendor to ship your items.
  </p>
  <a href="/orders" class="inline-block px-6 py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-bold transition">
    View My Orders
  </a>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6">Search Results {% if q %}for "{{ q }}"{% endif %}</h1>
  
  {% if products %}
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      {% for p in products %}
        <a href="/product/{{ p.id }}" class="bg-white rounded-2xl border border-slate-200 overflow-hidden hover:shadow-lg transition">
          <div class="aspect-square bg-slate-100"><img src="{{ p.image or 'https://via.placeholder.com/400' }}" class="w-full h-full object-cover"></div>
          <div class="p-3">
            <div class="text-sm font-medium truncate">{{ p.name }}</div>
            <div class="text-xs text-slate-500">{{ p.shop.name }}</div>
            <div class="font-bold text-amber-600 mt-1">₦{{ "{:,.2f}".format(p.price) }}</div>
          </div>
        </a>
      {% endfor %}
    </div>
  {% else %}
    <p class="text-slate-500 py-20 text-center">No products found matching your search.</p>
  {% endif %}
</div>
{% endblock %}
